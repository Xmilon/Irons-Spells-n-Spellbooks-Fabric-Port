plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url = "https://api.modrinth.com/maven" }
}

loom {
	accessWidenerPath = file("src/main/resources/irons_spellbooks.accesswidener")
	runs {
		client {
			runDir = "run/client"
		}
		server {
			runDir = "run/server"
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	implementation project(':irons-lib')
	include project(':irons-lib')
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "maven.modrinth:geckolib:${project.geckolib_version}"
	implementation "maven.modrinth:player-animation-library:${project.player_animation_version}"
	implementation files("libs/26.3/accessories-fabric-1.4.3-beta+26.3.jar", "libs/26.3/owo-lib-0.13.1+26.3.jar")
	include files("libs/26.3/accessories-fabric-1.4.3-beta+26.3.jar", "libs/26.3/owo-lib-0.13.1+26.3.jar")
	compileOnly files(zipTree('libs/26.3/owo-lib-0.13.1+26.3.jar').matching { include 'META-INF/jars/*.jar' })
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"
	compileOnly "com.google.j2objc:j2objc-annotations:2.8"
	compileOnly "com.electronwill.night-config:core:3.8.1"
	compileOnly "com.electronwill.night-config:toml:3.8.1"
	
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}

	// NeoForge/Create optional compat resources that error on Fabric when the target serializers are absent.
	exclude("data/irons_spellbooks/recipe/create_compat/**")
	exclude("data/irons_spellbooks/recipe/patchouli_book.json")
	exclude("data/irons_spellbooks/loot_table/test/**")
	exclude("data/irons_spellbooks/neoforge/**")
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs << "-Xmaxerrs" << "2000"
	// The unobfuscated game does not need Mixin's legacy refmap processor.
	it.options.compilerArgs << "-proc:none"
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	toolchain.languageVersion = JavaLanguageVersion.of(25)
}

sourceSets {
	main {
		java {
			exclude "io/redspace/ironsspellbooks/jei/**"
			exclude "io/redspace/ironsspellbooks/datagen/**"
		}
		resources {
			srcDir "src/generated/resources"
		}
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE.md") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

tasks.named("sourcesJar") {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('verifyBundledDependencies') {
	def checksums = [
		'accessories-fabric-1.4.3-beta+26.3.jar': '3bc31f765f1d145c36fdf2780d654efc17eee15e2129a31a8754c4c8d3c83234',
		'owo-lib-0.13.1+26.3.jar': '879e155e9bdde306e9c8a6e4120abf52ccc05d22743a4246348ea87b7a78ba53'
	]
	inputs.files(checksums.keySet().collect { file("libs/26.3/${it}") })
	doLast {
		checksums.each { name, expected ->
			def dependency = file("libs/26.3/${name}")
			def actual = java.security.MessageDigest.getInstance('SHA-256').digest(dependency.bytes).encodeHex().toString()
			if (actual != expected) {
				throw new GradleException("Bundled dependency checksum mismatch: ${name}")
			}
			new java.util.zip.ZipFile(dependency).withCloseable { archive ->
				def metadata = new groovy.json.JsonSlurper().parse(archive.getInputStream(archive.getEntry('fabric.mod.json')))
				(metadata.jars ?: []).each { nested ->
					if (archive.getEntry(nested.file) == null) {
						throw new GradleException("Missing nested dependency ${nested.file} in ${name}")
					}
				}
			}
		}
	}
}

// Keep the rendering migration check runnable while unrelated game APIs are being ported.
def portCompileClasspath = sourceSets.main.compileClasspath
tasks.register('compilePortRendering', JavaCompile) {
	source 'src/main/java/io/redspace/ironsspellbooks/render/RenderHelper.java',
		'src/main/java/io/redspace/ironsspellbooks/render/GuiQuadRenderState.java',
		'src/portTest/java/io/redspace/ironsspellbooks/render/GuiQuadSnapshotCheck.java'
	classpath = portCompileClasspath
	destinationDirectory = layout.buildDirectory.dir('port-rendering/classes')
	javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.register('verifyPortRendering', JavaExec) {
	dependsOn 'compilePortRendering'
	classpath = files(tasks.named('compilePortRendering').flatMap { it.destinationDirectory }) + portCompileClasspath
	mainClass = 'io.redspace.ironsspellbooks.render.GuiQuadSnapshotCheck'
	enableAssertions = true
	javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.named('check') {
	dependsOn 'verifyBundledDependencies', 'verifyPortRendering'
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
