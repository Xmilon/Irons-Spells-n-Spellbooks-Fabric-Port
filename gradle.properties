# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Java 25 toolchain: any JDK 25 works; this path is the one unpacked in build/port-tools. A missing path is ignored, so set JAVA_HOME or install JDK 25 elsewhere.
